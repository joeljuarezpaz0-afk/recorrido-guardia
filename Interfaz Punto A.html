<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto A</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #0b1c3d;
            font-size: 28px;
            margin-bottom: 25px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f3f4f6;
            outline: none;
            box-sizing: border-box;
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #6b7280;
            cursor: pointer;
        }
        .btn-green {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }
        .btn-green:hover {
            background-color: #059669;
        }
        .success-screen {
            display: none;
            text-align: center;
        }
        .success-text {
            color: #10b981;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .sub-text {
            color: #374151;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: Formulario -->
    <div class="container" id="pantallaInicio">
        <h1>PUNTO A</h1>
        <div class="input-group">
            <input type="text" id="nombreInput" placeholder="insertar nombre">
            <button class="clear-btn" onclick="limpiarInput()">×</button>
        </div>
        <button class="btn-green" onclick="enviarRecorrido()">Iniciar Recorrido</button>
    </div>

    <!-- Pantalla 2: Éxito -->
    <div class="container success-screen" id="pantallaExito">
        <div class="success-text">Recorrido iniciado</div>
        <div class="sub-text">Continúe con su labor</div>
    </div>

    <script>
        function limpiarInput() {
            document.getElementById('nombreInput').value = '';
        }

        function enviarRecorrido() {
            var nombre = document.getElementById('nombreInput').value;
            
            if (!nombre.trim()) {
                alert("Por favor, ingresa un nombre.");
                return;
            }

            // Obtener fecha y hora actual automáticamente
            var ahora = new Date();
            var fecha = ahora.toLocaleDateString();
            var hora = ahora.toLocaleTimeString();

            // Pega aquí la URL de tu aplicación web de Google Apps Script
            var urlGoogleScript = "PEGAR_AQUI_URL_DE_APLICACION_WEB";

            var datos = {
                nombre: nombre,
                fecha: fecha,
                hora: hora
            };

            // Enviar datos a Google Sheets
            fetch(urlGoogleScript, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            }).then(() => {
                // Mostrar pantalla de éxito
                document.getElementById('pantallaInicio').style.display = 'none';
                document.getElementById('pantallaExito').style.display = 'block';
            }).catch(error => {
                console.error("Error:", error);
                document.getElementById('pantallaInicio').style.display = 'none';
                document.getElementById('pantallaExito').style.display = 'block';
            });
        }
    </script>
</body>
</html>
