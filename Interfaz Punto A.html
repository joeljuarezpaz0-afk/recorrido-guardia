<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PUNTO A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen m-0 p-0 sm:p-4">

  <!-- Frame que simula la pantalla del celular en monitores/desktop, o pantalla completa en móvil -->
  <main class="bg-white w-full max-w-[414px] h-[100dvh] sm:h-[844px] sm:rounded-[40px] sm:shadow-2xl flex flex-col justify-center items-center px-8 relative overflow-hidden border border-gray-100 sm:border-gray-200">
    
    <!-- PANTALLA 1: Inicio de recorrido -->
    <div id="pantalla-1" class="w-full max-w-xs flex flex-col items-center gap-6 text-center transition-all duration-500 ease-in-out">
      
      <!-- 1. Título "PUNTO A" -->
      <h1 class="text-3xl font-extrabold tracking-wider text-slate-800 uppercase">
        PUNTO A
      </h1>

      <!-- 2. Campo de texto -->
      <div class="w-full">
        <input 
          id="input-nombre"
          type="text" 
          placeholder="insertar nombre"
          class="w-full px-5 py-3.5 bg-gray-50 border border-gray-300 rounded-xl text-gray-700 placeholder-gray-400 text-center text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all shadow-sm"
        />
      </div>

      <!-- 3. Botón Verde -->
      <button 
        id="btn-iniciar"
        type="button" 
        class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-semibold rounded-xl text-base shadow-lg shadow-emerald-500/25 transition-all cursor-pointer">
        Iniciar Recorrido
      </button>

    </div>

    <!-- PANTALLA 2: Recorrido iniciado -->
    <div id="pantalla-2" class="w-full max-w-xs flex-col items-center gap-4 text-center transition-all duration-500 ease-in-out hidden opacity-0 transform translate-y-4">
      
      <!-- Ícono de verificación en verde -->
      <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mb-2">
        <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>

      <!-- Texto principal en verde -->
      <h2 class="text-3xl font-extrabold text-emerald-500">
        Recorrido iniciado
      </h2>

      <!-- Subtexto -->
      <p class="text-gray-600 font-medium text-lg">
        continúe con su labor
      </p>

      <!-- Botón para volver (opcional para restablecer) -->
      <button 
        id="btn-volver"
        type="button" 
        class="mt-6 px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium rounded-xl text-sm transition-all cursor-pointer">
        Volver
      </button>

    </div>

  </main>

  <script>
    const pantalla1 = document.getElementById('pantalla-1');
    const pantalla2 = document.getElementById('pantalla-2');
    const btnIniciar = document.getElementById('btn-iniciar');
    const btnVolver = document.getElementById('btn-volver');

    btnIniciar.addEventListener('click', () => {
      // Ocultar pantalla 1 con animación
      pantalla1.classList.add('opacity-0', '-translate-y-4');
      
      setTimeout(() => {
        pantalla1.classList.add('hidden');
        
        // Mostrar pantalla 2
        pantalla2.classList.remove('hidden');
        setTimeout(() => {
          pantalla2.classList.remove('opacity-0', 'translate-y-4');
          pantalla2.classList.add('flex');
        }, 50);
      }, 300);
    });

    btnVolver.addEventListener('click', () => {
      // Ocultar pantalla 2
      pantalla2.classList.add('opacity-0', 'translate-y-4');
      
      setTimeout(() => {
        pantalla2.classList.add('hidden');
        pantalla2.classList.remove('flex');
        
        // Mostrar pantalla 1
        pantalla1.classList.remove('hidden');
        setTimeout(() => {
          pantalla1.classList.remove('opacity-0', '-translate-y-4');
        }, 50);
      }, 300);
    });
  </script>

</body>
</html>
